server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Kubernetes backend Service must be named chatbox-backend.
    location /backend/ {
        proxy_pass http://chatbox-backend:8080/;
        # The browser calls /backend/api/auth/* while the Go server sees
        # /api/auth/*. Rewrite Set-Cookie Path so refresh survives a reload.
        proxy_cookie_path /api/auth /backend/api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
