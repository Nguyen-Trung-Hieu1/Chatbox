alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by:
        - alertname
        - namespace
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: telegram
          matchers:
            - alertname =~ "ChatboxDeploymentReplicasUnavailable|ChatboxContainerRestarted"
    receivers:
      - name: 'null'
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id: 7385402919
            send_resolved: true
            parse_mode: HTML
            message: |-
              <b>{{ .Status | toUpper }}</b>: {{ .CommonLabels.alertname }}
              Namespace: {{ .CommonLabels.namespace }}
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ .Annotations.description }}{{ end }}
  alertmanagerSpec:
    secrets:
      - alertmanager-telegram
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 48Mi
      limits:
        cpu: 150m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

grafana:
  service:
    # Caddy on the EC2 host forwards HTTPS traffic to this K3s NodePort.
    type: NodePort
    nodePort: 30300
  grafana.ini:
    server:
      domain: grafana.chatbox.cyou
      root_url: https://grafana.chatbox.cyou
  admin:
    # Keep using the Secret created by the original Helm installation.
    # The password stays in Kubernetes and is never committed to Git.
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 4GB
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 700m
        memory: 700Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

prometheusOperator:
  livenessProbe:
    enabled: true
    failureThreshold: 6
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    failureThreshold: 6
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 250Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 150Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 80Mi
