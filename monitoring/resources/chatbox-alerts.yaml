apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chatbox-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: chatbox.availability
      rules:
        - alert: ChatboxDeploymentReplicasUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace="chatbox1"}
              > kube_deployment_status_replicas_available{namespace="chatbox1"}
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.deployment }} thiếu Pod sẵn sàng"
            description: "Deployment {{ $labels.deployment }} trong namespace chatbox1 đã thiếu replica sẵn sàng hơn 1 phút."

        - alert: ChatboxContainerRestarted
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="chatbox1"}[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} vừa restart"
            description: "Pod {{ $labels.pod }} trong namespace chatbox1 đã restart container trong 10 phút gần nhất."
