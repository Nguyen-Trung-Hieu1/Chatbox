apiVersion: v1
kind: Pod
metadata:
  name: pod-watcher-failure-test
  namespace: chatbox1
  labels:
    app: pod-watcher-failure-test
spec:
  restartPolicy: Never
  containers:
    - name: fail-once
      image: busybox:1.36
      command: ["sh", "-c", "exit 1"]
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          cpu: 20m
          memory: 16Mi
