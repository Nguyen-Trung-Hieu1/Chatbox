apiVersion: v1
kind: Pod
metadata:
  name: pod-watcher-test
  namespace: chatbox1
  labels:
    app: pod-watcher-test
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sleep", "600"]
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          cpu: 20m
          memory: 16Mi
