apiVersion: v1
kind: Pod
metadata:
  name: pod-event-alert-test
  namespace: chatbox1
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          cpu: 20m
          memory: 16Mi
