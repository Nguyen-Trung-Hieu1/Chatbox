apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatbox-pod-watcher
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatbox-pod-watcher
  namespace: chatbox1
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatbox-pod-watcher
  namespace: chatbox1
subjects:
  - kind: ServiceAccount
    name: chatbox-pod-watcher
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatbox-pod-watcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbox-pod-watcher
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chatbox-pod-watcher
  template:
    metadata:
      labels:
        app: chatbox-pod-watcher
    spec:
      serviceAccountName: chatbox-pod-watcher
      containers:
        - name: watcher
          image: ghcr.io/nguyen-trung-hieu1/chatbox-backend:sha-3066bca49083d76ad3b57d08ce81b81236b038f7
          imagePullPolicy: Always
          command: ["/app/pod-watcher"]
          env:
            - name: WATCH_NAMESPACE
              value: chatbox1
            - name: TELEGRAM_CHAT_ID
              value: "7385402919"
            - name: TELEGRAM_BOT_TOKEN_FILE
              value: /etc/telegram/bot-token
          volumeMounts:
            - name: telegram-token
              mountPath: /etc/telegram
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: telegram-token
          secret:
            secretName: alertmanager-telegram
            items:
              - key: bot-token
                path: bot-token
