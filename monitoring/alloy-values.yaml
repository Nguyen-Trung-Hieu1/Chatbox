alloy:
  enableReporting: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  configMap:
    content: |-
      discovery.kubernetes "chatbox_pods" {
        role = "pod"

        namespaces {
          names = ["chatbox1"]
        }
      }

      discovery.relabel "chatbox_pods" {
        targets = discovery.kubernetes.chatbox_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "chatbox_pods" {
        targets    = discovery.relabel.chatbox_pods.output
        forward_to = [loki.process.chatbox_logs.receiver]
      }

      loki.process "chatbox_logs" {
        stage.static_labels {
          values = {
            cluster = "chatbox1-aws",
          }
        }

        forward_to = [loki.write.local.receiver]
      }

      // Kubernetes Events are separate from container stdout/stderr logs.
      loki.source.kubernetes_events "chatbox" {
        namespaces = ["chatbox1"]
        log_format = "json"
        job_name   = "kubernetes-events"
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

controller:
  type: daemonset

configReloader:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
