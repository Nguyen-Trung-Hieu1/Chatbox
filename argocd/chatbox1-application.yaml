# This is the one bootstrap file applied manually to Argo CD.
# Argo CD then watches deploy/ on GitHub and keeps K3s in sync with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatbox1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nguyen-Trung-Hieu1/Chatbox.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: chatbox1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
