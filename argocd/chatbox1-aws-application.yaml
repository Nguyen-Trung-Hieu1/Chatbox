apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatbox1-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nguyen-Trung-Hieu1/Chatbox.git
    targetRevision: main
    path: deploy/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: chatbox1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
