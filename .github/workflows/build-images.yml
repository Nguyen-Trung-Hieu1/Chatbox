name: Build Chatbox1 images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/nguyen-trung-hieu1/chatbox-backend:main
            ghcr.io/nguyen-trung-hieu1/chatbox-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Nguyen-Trung-Hieu1/Chatbox
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/nguyen-trung-hieu1/chatbox-frontend:main
            ghcr.io/nguyen-trung-hieu1/chatbox-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Nguyen-Trung-Hieu1/Chatbox
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-deployment:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point K3s at the images from this commit
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i "s|image: ghcr.io/nguyen-trung-hieu1/chatbox-backend:.*|image: ghcr.io/nguyen-trung-hieu1/chatbox-backend:${IMAGE_TAG}|" deploy/local-app.yaml
          sed -i "s|image: ghcr.io/nguyen-trung-hieu1/chatbox-frontend:.*|image: ghcr.io/nguyen-trung-hieu1/chatbox-frontend:${IMAGE_TAG}|" deploy/local-app.yaml
      - name: Commit the new image version
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/local-app.yaml
          git commit -m "Deploy Chatbox1 ${GITHUB_SHA::7}"
          git push
