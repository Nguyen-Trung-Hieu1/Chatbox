name: Build Chatbox1 images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/nguyen-trung-hieu1/chatbox-backend:main
            ghcr.io/nguyen-trung-hieu1/chatbox-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Nguyen-Trung-Hieu1/Chatbox
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/nguyen-trung-hieu1/chatbox-frontend:main
            ghcr.io/nguyen-trung-hieu1/chatbox-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Nguyen-Trung-Hieu1/Chatbox
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
