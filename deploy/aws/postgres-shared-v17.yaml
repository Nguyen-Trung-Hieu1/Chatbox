# PostgreSQL 17 destination for consolidating Chatbox and Keycloak into app_db.
# Uses a fresh PVC: never mount the PostgreSQL 16 data directory with image 17.
# Existing PostgreSQL 16 and Keycloak PostgreSQL 17 remain untouched during copy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-postgres-v17-data
  namespace: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-postgres-v17
  namespace: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-postgres-v17
  template:
    metadata:
      labels:
        app: app-postgres-v17
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef:
                name: app-postgres-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-postgres-v17-data
---
apiVersion: v1
kind: Service
metadata:
  name: app-postgres-v17
  namespace: database
spec:
  selector:
    app: app-postgres-v17
  ports:
    - port: 5432
      targetPort: 5432
